    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --acid-green: #39ff14;
            --acid-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Urbanist', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(180deg, rgba(157,0,255,0.2) 0%, rgba(0,0,0,0) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--acid-green);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 3.5rem;
            color: var(--acid-green);
            text-shadow: 3px 3px var(--acid-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-main);
            margin-top: 5px;
            font-weight: 600;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 25px 0 15px 0;
            border-left: 4px solid var(--acid-purple);
            padding-left: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            display: grid;
            gap: 15px;
        }
